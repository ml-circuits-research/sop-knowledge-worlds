  <polygon points="28,30 42,40 14,40" fill="yellow" stroke="#333" stroke-width="0.8"><title>shoulder</title></polygon>
  <polygon points="54,62 74,62 71,90 57,90" fill="white" stroke="#333" stroke-width="0.8"><title>shot_glass</title></polygon>
  <rect x="23" y="16" width="10" height="18" fill="yellow" stroke="#333" stroke-width="0.8"><title>neck</title></rect>
  <rect x="14" y="52" width="28" height="24" fill="white" stroke="#333" stroke-width="0.8"><title>label</title></rect>
