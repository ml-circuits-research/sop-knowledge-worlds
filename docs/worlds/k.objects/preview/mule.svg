  <rect x="34" y="34" width="24" height="12" fill="red" stroke="#333" stroke-width="0.8"><title>pack</title></rect>
  <ellipse cx="91" cy="33" rx="5" ry="5" fill="white" stroke="#333" stroke-width="0.8"><title>muzzle</title></ellipse>
  <ellipse cx="79.5" cy="23.5" rx="1.5" ry="1.5" fill="black" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <polyline points="70,22 62,44" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>mane</title></polyline>
