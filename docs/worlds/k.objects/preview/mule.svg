<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>mule</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polyline points="20,46 10,62 12,72" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>tail</title></polyline>
  <rect x="24" y="62" width="6" height="30" fill="brown" stroke="#333" stroke-width="0.8"><title>hind_leg_1</title></rect>
  <rect x="34" y="62" width="6" height="30" fill="brown" stroke="#333" stroke-width="0.8"><title>hind_leg_2</title></rect>
  <rect x="56" y="62" width="6" height="30" fill="brown" stroke="#333" stroke-width="0.8"><title>fore_leg_1</title></rect>
  <rect x="66" y="62" width="6" height="30" fill="brown" stroke="#333" stroke-width="0.8"><title>fore_leg_2</title></rect>
  <ellipse cx="47" cy="54" rx="29" ry="14" fill="brown" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
  <polygon points="60,46 70,22 82,28 76,54" fill="brown" stroke="#333" stroke-width="0.8"><title>neck</title></polygon>
