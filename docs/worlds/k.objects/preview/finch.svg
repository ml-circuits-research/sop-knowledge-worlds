<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>finch</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <rect x="8" y="78" width="84" height="5" fill="brown" stroke="#333" stroke-width="0.8"><title>branch</title></rect>
  <polygon points="30,52 8,50 10,62 32,62" fill="brown" stroke="#333" stroke-width="0.8"><title>tail</title></polygon>
  <ellipse cx="48" cy="55" rx="22" ry="17" fill="yellow" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
  <ellipse cx="68" cy="36" rx="12" ry="12" fill="yellow" stroke="#333" stroke-width="0.8"><title>head</title></ellipse>
  <ellipse cx="44" cy="51" rx="14" ry="9" fill="brown" stroke="#333" stroke-width="0.8"><title>wing</title></ellipse>
  <polygon points="90,36 78,31 78,41" fill="orange" stroke="#333" stroke-width="0.8"><title>beak</title></polygon>
  <ellipse cx="70.5" cy="33.5" rx="2.5" ry="2.5" fill="black" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <polyline points="36,52 54,50" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>wing_bar</title></polyline>
  <polyline points="44,71 43,78" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>left_leg</title></polyline>
  <polyline points="54,71 55,78" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>right_leg</title></polyline>
  <path d="M58 32 A9 8 0 0 1 76 32" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>cap</title></path>
</svg>
