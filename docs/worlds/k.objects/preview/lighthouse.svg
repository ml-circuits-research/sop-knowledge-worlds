<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>lighthouse</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <rect x="25" y="90" width="50" height="8" fill="grey" stroke="#333" stroke-width="0.8"><title>base</title></rect>
  <polygon points="35,90 65,90 58,30 42,30" fill="white" stroke="#333" stroke-width="0.8"><title>tower</title></polygon>
  <polygon points="37,70 63,70 61,55 39,55" fill="red" stroke="#333" stroke-width="0.8"><title>stripe</title></polygon>
  <rect x="40" y="15" width="20" height="15" fill="yellow" stroke="#333" stroke-width="0.8"><title>lamp</title></rect>
  <polygon points="50,3 64,15 36,15" fill="red" stroke="#333" stroke-width="0.8"><title>cap</title></polygon>
  <rect x="46" y="78" width="8" height="12" fill="brown" stroke="#333" stroke-width="0.8"><title>door</title></rect>
</svg>
