<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>cougar</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polygon points="20.2,43.6 11.7,50.1 6.6,61.3 5.5,74.1 7.8,83.1 12.2,87.8 15.8,84.2 12.2,80.9 10.5,73.9 11.4,62.7 16.3,53.9 23.8,48.4" fill="orange" stroke="#333" stroke-width="0.8"><title>tail</title></polygon>
  <polygon points="64,44 74,28 88,32 80,56" fill="orange" stroke="#333" stroke-width="0.8"><title>neck</title></polygon>
  <rect x="24" y="54" width="7" height="34" fill="orange" stroke="#333" stroke-width="0.8"><title>back_leg_1</title></rect>
  <rect x="33" y="56" width="7" height="32" fill="orange" stroke="#333" stroke-width="0.8"><title>back_leg_2</title></rect>
  <rect x="62" y="56" width="7" height="32" fill="orange" stroke="#333" stroke-width="0.8"><title>front_leg_1</title></rect>
  <rect x="70" y="54" width="7" height="34" fill="orange" stroke="#333" stroke-width="0.8"><title>front_leg_2</title></rect>
  <ellipse cx="14.5" cy="85.5" rx="4.5" ry="3.5" fill="black" stroke="#333" stroke-width="0.8"><title>tail_tip</title></ellipse>
  <ellipse cx="28" cy="88.5" rx="5" ry="2.5" fill="orange" stroke="#333" stroke-width="0.8"><title>paw_1</title></ellipse>
  <ellipse cx="37" cy="88.5" rx="5" ry="2.5" fill="orange" stroke="#333" stroke-width="0.8"><title>paw_2</title></ellipse>
  <ellipse cx="66" cy="88.5" rx="5" ry="2.5" fill="orange" stroke="#333" stroke-width="0.8"><title>paw_3</title></ellipse>
  <ellipse cx="74" cy="88.5" rx="5" ry="2.5" fill="orange" stroke="#333" stroke-width="0.8"><title>paw_4</title></ellipse>
  <ellipse cx="48" cy="50" rx="32" ry="12" fill="orange" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
