  <ellipse cx="83" cy="24.5" rx="2" ry="1.5" fill="black" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <polyline points="90,35 95,34" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>mouth</title></polyline>
