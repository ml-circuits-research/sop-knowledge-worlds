  <rect x="16" y="26" width="4" height="4" fill="grey" stroke="#333" stroke-width="0.8"><title>sight</title></rect>
  <rect x="14" y="30" width="62" height="14" fill="grey" stroke="#333" stroke-width="0.8"><title>barrel</title></rect>
