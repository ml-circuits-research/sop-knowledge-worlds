<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>boat</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polyline points="50,10 50,60" fill="none" stroke="brown" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>mast</title></polyline>
  <polygon points="5,60 95,60 80,85 20,85" fill="brown" stroke="#333" stroke-width="0.8"><title>hull</title></polygon>
  <polygon points="52,12 52,55 87,55" fill="white" stroke="#333" stroke-width="0.8"><title>main_sail</title></polygon>
  <polygon points="48,20 48,55 22,55" fill="white" stroke="#333" stroke-width="0.8"><title>front_sail</title></polygon>
</svg>
