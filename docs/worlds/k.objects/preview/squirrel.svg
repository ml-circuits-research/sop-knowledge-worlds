<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>squirrel</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polygon points="38,84 18,78 8,56 12,30 26,16 38,22 34,40 28,56 36,70" fill="brown" stroke="#333" stroke-width="0.8"><title>tail</title></polygon>
  <ellipse cx="51" cy="65" rx="15" ry="21" fill="brown" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
  <ellipse cx="54" cy="68" rx="8" ry="14" fill="white" stroke="#333" stroke-width="0.8"><title>belly</title></ellipse>
  <polygon points="52,14 56,26 48,26" fill="brown" stroke="#333" stroke-width="0.8"><title>left_ear</title></polygon>
  <polygon points="65,14 69,26 61,26" fill="brown" stroke="#333" stroke-width="0.8"><title>right_ear</title></polygon>
  <ellipse cx="59" cy="35" rx="13" ry="13" fill="brown" stroke="#333" stroke-width="0.8"><title>head</title></ellipse>
  <ellipse cx="61" cy="86" rx="11" ry="4" fill="brown" stroke="#333" stroke-width="0.8"><title>foot</title></ellipse>
  <ellipse cx="64.5" cy="32.5" rx="2.5" ry="2.5" fill="black" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <ellipse cx="72" cy="39" rx="2" ry="2" fill="black" stroke="#333" stroke-width="0.8"><title>nose</title></ellipse>
  <polyline points="56,56 68,54" fill="none" stroke="brown" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>arm</title></polyline>
  <ellipse cx="71" cy="54.5" rx="5" ry="6.5" fill="yellow" stroke="#333" stroke-width="0.8"><title>acorn</title></ellipse>
  <rect x="65" y="46" width="12" height="5" fill="brown" stroke="#333" stroke-width="0.8"><title>acorn_cap</title></rect>
</svg>
