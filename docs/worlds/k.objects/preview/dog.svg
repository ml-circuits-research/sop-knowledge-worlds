  <rect x="38" y="68" width="7" height="27" fill="brown" stroke="#333" stroke-width="0.8"><title>front_leg</title></rect>
  <rect x="72" y="68" width="7" height="27" fill="brown" stroke="#333" stroke-width="0.8"><title>back_leg</title></rect>
  <ellipse cx="58.5" cy="59" rx="26.5" ry="14" fill="brown" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
  <ellipse cx="25" cy="35" rx="15" ry="15" fill="brown" stroke="#333" stroke-width="0.8"><title>head</title></ellipse>
