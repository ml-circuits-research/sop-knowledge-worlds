<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>alligator</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polygon points="4,56 30,50 30,62" fill="green" stroke="#333" stroke-width="0.8"><title>tail</title></polygon>
  <rect x="32" y="62" width="6" height="10" fill="green" stroke="#333" stroke-width="0.8"><title>back_leg</title></rect>
  <rect x="56" y="62" width="6" height="10" fill="green" stroke="#333" stroke-width="0.8"><title>front_leg</title></rect>
  <polygon points="36.5,43 39,48 34,48" fill="green" stroke="#333" stroke-width="0.8"><title>ridge_1</title></polygon>
  <polygon points="44.5,43 47,48 42,48" fill="green" stroke="#333" stroke-width="0.8"><title>ridge_2</title></polygon>
  <polygon points="52.5,42 55,47 50,47" fill="green" stroke="#333" stroke-width="0.8"><title>ridge_3</title></polygon>
  <polygon points="60.5,41 63,46 58,46" fill="green" stroke="#333" stroke-width="0.8"><title>ridge_4</title></polygon>
  <polygon points="26,48 66,46 70,56 66,64 26,64" fill="green" stroke="#333" stroke-width="0.8"><title>body</title></polygon>
  <polygon points="64,48 84,50 98,54 98,58 84,60 64,62" fill="green" stroke="#333" stroke-width="0.8"><title>head</title></polygon>
  <ellipse cx="72.5" cy="46.5" rx="2.5" ry="2.5" fill="yellow" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <polyline points="70,57 98,56" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>mouth</title></polyline>
  <ellipse cx="72.5" cy="46.5" rx="1" ry="1" fill="black" stroke="#333" stroke-width="0.8"><title>pupil</title></ellipse>
  <polygon points="78,56.5 81,56.5 79.5,59.5" fill="white" stroke="#333" stroke-width="0.8"><title>tooth_1</title></polygon>
  <polygon points="85,56.3 88,56.3 86.5,59.3" fill="white" stroke="#333" stroke-width="0.8"><title>tooth_2</title></polygon>
  <polygon points="92,56 95,56 93.5,59" fill="white" stroke="#333" stroke-width="0.8"><title>tooth_3</title></polygon>
</svg>
