<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>cheesecake</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <polygon points="12,72 90,64 90,72 12,80" fill="brown" stroke="#333" stroke-width="0.8"><title>crust</title></polygon>
  <polygon points="12,52 90,42 90,64 12,72" fill="white" stroke="#333" stroke-width="0.8"><title>filling</title></polygon>
  <polygon points="12,52 66,28 90,42" fill="white" stroke="#333" stroke-width="0.8"><title>top</title></polygon>
  <polygon points="44,40 66,28 90,42 90,50 86,48 84,56 80,46 72,48 70,54 66,46 56,48" fill="red" stroke="#333" stroke-width="0.8"><title>sauce</title></polygon>
  <ellipse cx="71" cy="28" rx="7" ry="6" fill="red" stroke="#333" stroke-width="0.8"><title>strawberry</title></ellipse>
  <polygon points="71,18 75,24 67,24" fill="green" stroke="#333" stroke-width="0.8"><title>leaf</title></polygon>
