  <polygon points="8,66 92,66 80,86 18,86" fill="white" stroke="#333" stroke-width="0.8"><title>hull</title></polygon>
  <rect x="36" y="54" width="28" height="12" fill="white" stroke="#333" stroke-width="0.8"><title>cabin</title></rect>
  <rect x="49" y="6" width="2" height="48" fill="black" stroke="#333" stroke-width="0.8"><title>mast</title></rect>
