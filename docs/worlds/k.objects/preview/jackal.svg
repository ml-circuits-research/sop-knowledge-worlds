  <rect x="26" y="56" width="6" height="34" fill="brown" stroke="#333" stroke-width="0.8"><title>back_leg_1</title></rect>
  <rect x="34" y="56" width="6" height="34" fill="brown" stroke="#333" stroke-width="0.8"><title>back_leg_2</title></rect>
  <rect x="62" y="56" width="6" height="34" fill="brown" stroke="#333" stroke-width="0.8"><title>front_leg_1</title></rect>
  <rect x="70" y="56" width="6" height="34" fill="brown" stroke="#333" stroke-width="0.8"><title>front_leg_2</title></rect>
  <ellipse cx="49" cy="51" rx="29" ry="13" fill="brown" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
