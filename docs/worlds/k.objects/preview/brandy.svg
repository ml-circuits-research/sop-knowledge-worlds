<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>brandy</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <rect x="68" y="73" width="4" height="13" fill="white" stroke="#333" stroke-width="0.8"><title>stem</title></rect>
  <rect x="12" y="40" width="26" height="50" fill="brown" stroke="#333" stroke-width="0.8"><title>bottle</title></rect>
  <polygon points="25,28 38,40 12,40" fill="brown" stroke="#333" stroke-width="0.8"><title>shoulder</title></polygon>
  <ellipse cx="70" cy="54" rx="20" ry="20" fill="white" stroke="#333" stroke-width="0.8"><title>bowl</title></ellipse>
  <ellipse cx="70" cy="87.5" rx="14" ry="3.5" fill="white" stroke="#333" stroke-width="0.8"><title>foot</title></ellipse>
  <rect x="20" y="16" width="10" height="16" fill="brown" stroke="#333" stroke-width="0.8"><title>neck</title></rect>
  <rect x="12" y="54" width="26" height="18" fill="yellow" stroke="#333" stroke-width="0.8"><title>label</title></rect>
