<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>raven</title>
  <rect width="100" height="100" fill="#fafafa"/>
  <rect x="6" y="84" width="88" height="6" fill="green" stroke="#333" stroke-width="0.8"><title>ground</title></rect>
  <polygon points="30,52 4,60 8,70 32,64" fill="black" stroke="#333" stroke-width="0.8"><title>tail</title></polygon>
  <ellipse cx="48" cy="53" rx="24" ry="17" fill="black" stroke="#333" stroke-width="0.8"><title>body</title></ellipse>
  <ellipse cx="70" cy="32" rx="12" ry="12" fill="black" stroke="#333" stroke-width="0.8"><title>head</title></ellipse>
  <polygon points="80,28 96,36 80,40" fill="grey" stroke="#333" stroke-width="0.8"><title>beak</title></polygon>
  <ellipse cx="72.5" cy="30.5" rx="2.5" ry="2.5" fill="white" stroke="#333" stroke-width="0.8"><title>eye</title></ellipse>
  <path d="M30 44 A17 16 0 0 0 64 44" fill="none" stroke="grey" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>wing</title></path>
  <polyline points="42,69 40,84" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>left_leg</title></polyline>
  <polyline points="54,69 56,84" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>right_leg</title></polyline>
  <polyline points="64,42 60,48 66,46" fill="none" stroke="grey" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>throat</title></polyline>
  <ellipse cx="72.7" cy="30.7" rx="1.2" ry="1.2" fill="black" stroke="#333" stroke-width="0.8"><title>pupil</title></ellipse>
