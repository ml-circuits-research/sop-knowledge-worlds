  <rect x="44" y="12" width="12" height="18" fill="white" stroke="#333" stroke-width="0.8"><title>belfry</title></rect>
  <ellipse cx="50" cy="68" rx="7" ry="7" fill="brown" stroke="#333" stroke-width="0.8"><title>door_arch</title></ellipse>
