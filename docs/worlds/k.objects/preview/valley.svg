  <rect x="2" y="4" width="96" height="50" fill="blue" stroke="#333" stroke-width="0.8"><title>sky</title></rect>
  <ellipse cx="76" cy="14" rx="6" ry="6" fill="yellow" stroke="#333" stroke-width="0.8"><title>sun</title></ellipse>
  <polygon points="50,20 70,66 30,66" fill="grey" stroke="#333" stroke-width="0.8"><title>far_mountain</title></polygon>
  <polygon points="50,20 56.5,35 43.5,35" fill="white" stroke="#333" stroke-width="0.8"><title>snow</title></polygon>
