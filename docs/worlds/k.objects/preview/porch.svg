  <rect x="84" y="54" width="4" height="32" fill="white" stroke="#333" stroke-width="0.8"><title>post_4</title></rect>
  <polygon points="8,54 14,46 86,46 92,54" fill="red" stroke="#333" stroke-width="0.8"><title>porch_roof</title></polygon>
  <polyline points="60,72 88,72" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>railing</title></polyline>
  <rect x="8" y="86" width="84" height="5" fill="brown" stroke="#333" stroke-width="0.8"><title>floor</title></rect>
