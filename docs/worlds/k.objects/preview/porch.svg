  <polygon points="50,6 86,27 14,27" fill="red" stroke="#333" stroke-width="0.8"><title>roof</title></polygon>
  <rect x="43" y="60" width="14" height="26" fill="brown" stroke="#333" stroke-width="0.8"><title>door</title></rect>
  <rect x="26" y="60" width="12" height="12" fill="blue" stroke="#333" stroke-width="0.8"><title>window</title></rect>
  <rect x="12" y="54" width="4" height="32" fill="white" stroke="#333" stroke-width="0.8"><title>post_1</title></rect>
  <rect x="36" y="54" width="4" height="32" fill="white" stroke="#333" stroke-width="0.8"><title>post_2</title></rect>
